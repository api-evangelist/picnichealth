name: PicnicHealth
description: >-
  PicnicHealth is a patient-first digital health platform, founded in 2014, that gathers a
  person's complete medical history from every point of care into one organized timeline, layers
  on an AI health assistant (PicnicAI) and a virtual clinical team to help members understand and
  act on their care, and — with patient consent — turns de-identified records into OMOP-compliant
  real-world data for life-science and HEOR research. Records are encrypted, patient-owned, and
  never shared without permission. PicnicHealth does not publish a public REST/OpenAPI developer
  API; its programmatic surface is a first-party R package that analyzes delivered research
  datasets mapped to RxNorm/SNOMED/LOINC. Backed by Amplify Partners, Felicis, Lux Capital, and
  Slow Ventures.
